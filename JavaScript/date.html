<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date and DOM</title>
</head>
<body>
  <div class="my-div">
    this is my div
  </div>
  <script>
    let obj = new Date();
    console.log(obj.getDate());
    console.log(obj.getDay());
    console.log(obj.getFullYear());
    console.log(obj.getTime());
    console.log(obj.getHours());
    console.log(obj.getMinutes());
    console.log(obj.getSeconds());

    let button = document.createElement('Button');
    document.querySelector('.my-div').appendChild(button);
    button.innerText=`Click me`;
    document.querySelector('.my-div').removeChild(button);
  </script>
</body>
</html>

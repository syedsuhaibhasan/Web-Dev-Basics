<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immediatly Invoked Function Expressions(IIFE)</title>
</head>
<body>
    <script>
        ( ()=>{
            sohaib();
        })();
        function sohaib(){
            console.log(`myself sohaib`);
        }
    </script>
</body>
</html>

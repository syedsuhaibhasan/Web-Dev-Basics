<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Weather App</title>
</head>
<body>
    
    <div class="main-div">
        <div class="main-container">
            <div class="search-bar-container">
                <input id="search-bar" type="text">
                <span class="material-symbols-outlined">
search
</span>
            </div>
            <div class="country-container">
                <span id="country-name">Pakistan</span>
                <span id="location"><img src="./images/location.png" alt=""></span>
                <div class="date-container">date</div>
            </div>
            <div class="weather-logo">weather logo</div>
            <div class="stats-container">
                <div class="temperature">
                    <div>Temperature
                        <span class="material-symbols-outlined">thermostat</span>
                    </div>
                    
                    <div id="temp-val">31.26</div>
                </div>
                <div class="wind-speed">Wind Speed</div>
                <div class="humidity">Humidity</div>
            </div>
            <div class="forecast">
                <div class="days">mon</div>
                <div class="days">tues</div>
                <div class="days">wed</div>
                <div class="days">thurs</div>
                <div class="days">fri</div>
            </div>
        </div>
       
    </div>
</body>
</html>

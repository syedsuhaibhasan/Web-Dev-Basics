<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Weather App</title>
</head>
<body>
    
    <div class="main-div">
        <div class="main-container">
            <div class="search-bar">
                <input type="text">
                <span>logo</span>
            </div>
            <div class="coutry-name">country</div>
            <div class="date-container">date</div>
            <div class="weather-logo">weather logo</div>
            <div class="temperature">temp</div>
            <div class="wind-speed">Wind Speed</div>
            <div class="humidity">Humidity</div>
            <div class="forecast">
                <div id="monday">mon</div>
                <div id="tuesday">tues</div>
                <div id="wednesday">wed</div>
                <div id="thursday">thurs</div>
                <div id="friday">fri</div>
            </div>
        </div>
       
    </div>
</body>
</html>

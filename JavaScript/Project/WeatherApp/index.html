<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="./index.css">
    
    <title>Weather App</title>
</head>
<body>
    
    <div class="main-div">
        <div class="main-container">
            <div class="search-bar-container">
                <input id="search-bar" type="text">
                <span style="font-size: 2.3rem;
                position: absolute;
                top: 10%;
                left: 60%;"
                class="material-symbols-outlined">search</span>
            </div>
            <div class="country-container">
                <span id="country-city"></span>
                <span id="location" class="material-symbols-outlined">location_on</span>
                <br>
                <div class="date-container"></div>
            </div>
            <div id="weather-icon">
                <img id="icon" alt="">
            </div>
            <div class="stats-container">
                <div class="temperature">
                    <div>Temperature
                        <span class="material-symbols-outlined" style="font-size: 15px;
                        position: absolute;"
                        >thermostat</span>
                    </div>
                    
                    <div id="temp-val"></div>
                </div>
                <div class="wind-speed">
                    <div>Wind Speed
                        <span class="material-symbols-outlined" style="font-size: 15px;
                        position: absolute;">air</span>
                    </div>

                    <div id="windSpeed-val"></div>
                </div>
                <div class="humidity">
                    <div>Humidity
                        <span class="material-symbols-outlined" style="font-size: 15px;
                        position: absolute;">water_drop</span>
                    </div>
                    <div id="humidity-val"></div>
                </div>
            </div>
            <div class="forecast">
                <div class="days">mon</div>
                <div class="days">tues</div>
                <div class="days">wed</div>
                <div class="days">thurs</div>
                <div class="days">fri</div>
            </div>
        </div>
       
    </div>
    <script src="./app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      text-align: center;
    }
    .images{
      height: 75px;
      border-radius: 50px;
    }
    .btn{
      border-radius: 50px;
      background-color: darkolivegreen;
      border: 2px solid black;
    }
  </style>
  <title>Bat Ball Stump Game</title>
</head>
<body>
  <h1>Bat Ball Stump Game</h1>
  
  <div class="btn-container">
    <button class="btn" onclick=" let computerChoice = generateComputerChoice();
    let resultMsg = getResult('Bat', computerChoice);
    showResult('Bat', computerChoice, resultMsg);
    "><img class="images" src="./bat.jpg" alt="bat image"></button>

    <button class="btn" onclick="
    computerChoice = generateComputerChoice();
    resultMsg = getResult('Ball', computerChoice);
    showResult('Ball', computerChoice, resultMsg);
    "><img class="images" src="./ball.jpeg" alt="ball image"></button>

    <button class="btn" onclick="
    computerChoice = generateComputerChoice();
    resultMsg = getResult('Stump', computerChoice);
    showResult('Stump', computerChoice, resultMsg);
    "><img class="images" src="./download1.png" alt="stumps image"></button>
  </div>

  <h3 id="User-move"></h3>
  <h3 id="Computer-move"></h3>
  <h3 id="result"></h3>
  <h3 id="score"></h3>

  <script>
    let scoreStr = localStorage.getItem('Score');
    let score;
    resetScore(scoreStr);
    function resetScore(scoreStr){
    score =scoreStr ? JSON.parse(scoreStr) : {
        win: 0,
        lost: 0,
        tie: 0,
      };

    score.displayScore = function() {
        return `Score: Won:${score.win}, Lost:${score.lost}, Tie: ${score.tie}`;
      };

      showResult();
    }
    function generateComputerChoice() {
      let randomNumber = Math.random() * 3;
      if (randomNumber > 0 && randomNumber <= 1) {
        return 'Bat';
      } else if (randomNumber > 1 && randomNumber <= 2) {
        return 'Ball';
      } else {
        return 'Stump'
      }
    }

    function getResult(userMove, computerMove) {
      if (userMove === 'Bat') {
        if (computerMove === 'Ball') {
          score.win++;
          return 'User won.';
        } else if (computerMove === 'Bat') {
          score.tie++;
          return `It's a tie`;
        } else if (computerMove === 'Stump') {
          score.lost++;
          return 'Computer has won';
        }
      } else if (userMove === 'Ball') {
        if (computerMove === 'Ball') {
          score.tie++;
          return `It's a tie`;
        } else if (computerMove === 'Bat') {
          score.lost++;
          return 'Computer has won';
        } else if (computerMove === 'Stump') {
          score.win++;
          return 'User won.';
        }
      } else {
        if (computerMove === 'Ball') {
          score.lost++;
          return 'Computer has won';
        } else if (computerMove === 'Bat') {
          score.win++;
          return 'User won.';
        } else if (computerMove === 'Stump') {
          score.tie++;
          return `It's a tie`;
        }
      }
    }

    
    function showResult(userMove, computerMove, result) {
      localStorage.setItem('Score',JSON.stringify(score));
      document.querySelector('#User-move').innerText = userMove ? `You have chose ${userMove}` : '';
      document.querySelector('#Computer-move').innerText = computerMove ? `Computer has chosen ${computerMove}` : '';
      document.querySelector('#result').innerText = result || '';
      document.querySelector('#score').innerText = `${score.displayScore()}`
       
      // alert(`You have chosen ${userMove} \n Computer have chosen ${computerMove} \n ${result} \n${score.displayScore()}`);
    }   
  </script>
  <button onclick="localStorage.clear();
      resetScore();">
      Reset
    </button>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      text-align: center;
    }
  </style>
  <title>Bat Ball Stump Game</title>
</head>
<body>
  <h1>Bat Ball Stump Game</h1>
  
  <div class="btn-container">
    <button onclick="
    let computerChoice;
    randomNumber = optionSelector();
    computerChoice=botChoice(randomNumber);
    getResult('bat',computerChoice);
    ">Bat</button>

    <button onclick="
    let randomNumber;
    randomNumber = optionSelector();
    computerChoice=botChoice(randomNumber);
    getResult('ball',computerChoice);
    ">Ball</button>

    <button onclick="
    randomNumber = optionSelector();
    computerChoice=botChoice(randomNumber);
    getResult('stump',computerChoice);
    ">Stump</button>
  </div>

  <script>
    let score = {
      win: 0,
      lost: 0,
      tie: 0,
    };

    function optionSelector() {
      let number = Math.random()*3;
      return number;
    }

    function botChoice(randomNumber) {
      if(randomNumber>0 && randomNumber<=1) {
      computerChoice = 'bat';
      }
      else if(randomNumber>1 && randomNumber<=2){
      computerChoice = 'ball';
      }else{
      computerChoice = 'stump';
      }
      return computerChoice;
    }

    function getResult(userChoice,computerChoice){
    if(userChoice==='bat'){
      if(computerChoice==='ball'){
      score.win++;
      alert(`Computer Choice is ${computerChoice} and User Choice is bat hence you WON \n YOUR SCORE:`+`\n Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`);
      }
      else if(computerChoice==='bat'){
      score.tie++;
      alert(`Computer Choice is ${computerChoice} and User Choice is bat hence its a TIE! \n YOUR SCORE:`+`\n Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`);
      }
      else{
      score.lost++;
      alert(`Computer Choice is ${computerChoice} and User Choice is bat hence you LOSE \n YOUR SCORE:`+`\n Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`);
      }
    }

    if (userChoice==='ball') {
      if(computerChoice==='ball'){
        score.tie++;
      alert(`Computer Choice is ${computerChoice} and User Choice is ball hence its a TIE \n YOUR SCORE:`+`\n Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`);
    }
    else if(computerChoice==='bat'){
      score.lost++;
      alert(`Computer Choice is ${computerChoice} and User Choice is ball hence you LOSE \n YOUR SCORE:`+`\n Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`);
    }
    else{
      score.tie++;
      alert(`Computer Choice is ${computerChoice} and User Choice is ball hence you WON \n YOUR SCORE:`+`\n Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`);
      }
    }

    if (userChoice==='stump') {
      if(computerChoice==='ball'){
        score.lose++;
      alert(`Computer Choice is ${computerChoice} and User Choice is Stumps hence you LOSE \n YOUR SCORE:`+`\n Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`);
    }
    else if(computerChoice==='bat'){
      score.win++;
      alert(`Computer Choice is ${computerChoice} and User Choice is Stumps hence you WON \n YOUR SCORE:`+`\n Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`);
    }
    else{
      score.tie++;
      alert(`Computer Choice is ${computerChoice} and User Choice is Stumps hence its a TIE! \n YOUR SCORE`+`\n Win: ${score.win} Lost: ${score.lost} Tie: ${score.tie}`);
    }
    }
    }
  </script>
</body>
</html>

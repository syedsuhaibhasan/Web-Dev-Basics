<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      text-align: center;
    }
  </style>
  <title>Bat Ball Stump Game</title>
</head>
<body>
  <h1>Bat Ball Stump Game</h1>
  
  <div class="btn-container">
    <button onclick="
    let computerChoice;
    randomNumber = optionSelector();
    computerChoice=botChoice(randomNumber);

    if(computerChoice==='ball'){
      alert(`Computer Choice is ${computerChoice} and User Choice is bat hence you WON`);
    }
    else if(computerChoice==='bat'){
      alert(`Computer Choice is ${computerChoice} and User Choice is bat hence its a TIE!`);
    }
    else{
      alert(`Computer Choice is ${computerChoice} and User Choice is bat hence you LOSE`);
    }
    ">Bat</button>

    <button onclick="
    let randomNumber;
    randomNumber = optionSelector();
    computerChoice=botChoice(randomNumber);

    if(computerChoice==='ball'){
      alert(`Computer Choice is ${computerChoice} and User Choice is ball hence its a TIE`);
    }
    else if(computerChoice==='bat'){
      alert(`Computer Choice is ${computerChoice} and User Choice is ball hence you LOSE`);
    }
    else{
      alert(`Computer Choice is ${computerChoice} and User Choice is ball hence you WON`);
    }
    ">Ball</button>

    <button onclick="
    randomNumber = optionSelector();
    computerChoice=botChoice(randomNumber);

    if(computerChoice==='ball'){
      alert(`Computer Choice is ${computerChoice} and User Choice is Stumps hence you LOSE`);
    }
    else if(computerChoice==='bat'){
      alert(`Computer Choice is ${computerChoice} and User Choice is Stumps hence you WON`);
    }
    else{
      alert(`Computer Choice is ${computerChoice} and User Choice is Stumps hence its a TIE!`);
    }
    ">Stump</button>
  </div>

  <script>
    function optionSelector() {
      let number = Math.random()*3;
      return number;
    }

    function botChoice(randomNumber) {
      if(randomNumber>0 && randomNumber<=1) {
      computerChoice = 'bat';
      }
      else if(randomNumber>1 && randomNumber<=2){
      computerChoice = 'ball';
      }else{
      computerChoice = 'stump';
      }
      return computerChoice;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <title>Calculator</title>
</head>
<body>
  <div id = "main-div">
  <input id="input-field" class= "input-field" type="text" readonly>
  <div class="btn-container">
    <button class="btns" onclick="currentInput = ' ';
      document.querySelector('#input-field').value = currentInput;">C</button>
    <button class="btns" onclick="currentInput = currentInput+'1';
      document.querySelector('#input-field').value = currentInput;">1</button>

    <button class="btns" onclick="currentInput = currentInput + '2';
      document.querySelector('#input-field').value = currentInput;">2</button>

    <button class="btns" onclick="currentInput = currentInput + '+';
      document.querySelector('#input-field').value = currentInput;">+</button>

    <button class="btns" onclick="currentInput = currentInput+3;
      document.querySelector('#input-field').value = currentInput;">3</button>

    <button class="btns" onclick="currentInput=currentInput+'4';
      document.querySelector('#input-field').value = currentInput;">4</button>

    <button class="btns" onclick="currentInput = currentInput + '-';
      document.querySelector('#input-field').value = currentInput;"><strong>-</strong></button>

    <button class="btns" onclick="currentInput=currentInput+'5'
      document.querySelector('#input-field').value = currentInput;">5</button>

    <button class="btns" onclick="currentInput=currentInput+'6';
      document.querySelector('#input-field').value = currentInput;">6</button>

    <button class="btns" onclick="currentInput = currentInput + '*';
      document.querySelector('#input-field').value = currentInput;">*</button>

    <button class="btns" onclick="currentInput=currentInput+'7';
      document.querySelector('#input-field').value = currentInput;">7</button>

    <button class="btns" onclick="currentInput=currentInput+'8';
      document.querySelector('#input-field').value = currentInput;">8</button>

    <button class="btns" onclick="currentInput = currentInput + '/';
      document.querySelector('#input-field').value = currentInput;">/</button>

    <button class="btns" onclick="let result = eval(currentInput);
      currentInput = result;
      document.querySelector('#input-field').value = currentInput;">=</button>

    <button class="btns" onclick="currentInput=currentInput+'9';
      document.querySelector('#input-field').value = currentInput;">9</button>
    
    <button class="btns" onclick="currentInput=currentInput+'0';
      document.querySelector('#input-field').value = currentInput;">0</button>
    
    <button class="btns" onclick="currentInput = currentInput + '.';
      document.querySelector('#input-field').value = currentInput;">.</button>
   
  </div>
   <script>
      let currentInput = '';
      document.querySelector('#input-field').value = currentInput;
   </script>
  </div>
</body>
</html>

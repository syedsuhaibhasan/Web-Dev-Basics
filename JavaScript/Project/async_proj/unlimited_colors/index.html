<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited Color</title>
</head>
<body>
    <div>
        <h1>Start should change the background color every second</h1>
    </div>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <script>
        const randomColor = function(){
            const hex = "0123456789ABCDEF";
            let color = '#';
            for(let i = 0; i < 6; i++){
                color += hex[Math.floor(Math.random()*16)];
            }
            return color;
        }

        let intervalId;
        function startColor(){
            if (!intervalId) {
                intervalId = setInterval(function(){
                const root = document.documentElement;
                root.style.backgroundColor = randomColor();
            },1000)
            }
        };

        function stopColor(){
            clearInterval(intervalId)
            intervalId = null;
        };

        const start = document.querySelector('#start').addEventListener('click',startColor);
        const stop = document.querySelector('#stop').addEventListener('click',stopColor);
    </script>
</body>
</html>

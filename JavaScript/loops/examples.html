<body>
    <script>

        function isPrime(num){
            for (let i = 0; i < num; i++){
                if (num%i===0 || num<=1) {
                    return false;
                }
            }
            return true;
        }

        let i=0;
        let count=0;
        while (count<=5) {
            if(isPrime(i)){
                count++;
                console.log(i);
            }
            i++;
        }
    </script>
</body>

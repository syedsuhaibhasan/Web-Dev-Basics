<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        arr = [5,6];
        console.log(arr);
        arr.push(4);
        console.log(arr);
        arr.unshift(7);
        console.log(arr);

        function index(num){
            for(let i=0; i<arr.length; i++){
                if (num===arr[i]) {
                    return i;
                    break;
                }
            }
        }

        let numb = index(5);
        console.log(numb);

        arr.splice(1,2,2,6);
        console.log(arr);
    </script>
</body>

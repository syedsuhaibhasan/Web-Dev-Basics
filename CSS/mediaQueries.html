<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #box{
            height: 100px;
            width: 100px;
            background-color: green;
            margin: 5px;
            padding: 5px;
        }
        @media screen and (min-width: 250px) and (max-width: 300px) {
            #box{
                height: 150px;
                width: 150px;
            }
        }
    </style>
    <title>Media Queries</title>
</head>
<body>
    <div id="box">Box</div>
</body>
</html>

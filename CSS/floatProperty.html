<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #container{
            height: 200px;
            width: 500px;
            background-color: palevioletred;
            border: 3px solid black;

        }

        .box{
            height: 150px;
            width: 150px;
            background-color: lightblue;
            margin: 5px;
            border: 3px solid black;
        }
        #div{
            float: right;
        }
    </style>
    <title>Float Property</title>
</head>
<body>
    <div id="container">
        <div id="div" class="box">BOX 1</div>
        <div id="div2" class="box">BOX 2</div>
    </div>
</body>
</html>

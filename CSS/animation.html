<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .box{
            height: 100px;
            width: 100px;
            background-color: plum;
            border: 3px solid black;
            border-radius: 5px;
            position: relative;
            top: 10px;
            left: 10px;
            /* animation-name: movement;
            animation-duration: 2s;
            animation-timing-function: ease-in;
            animation-delay: 1s;

            animation-iteration-count: infinite;
            animation-direction: alternate; */

            /* short hand to write animation */
            animation: movement2 2s ease-in-out 1s infinite alternate;
        }

        /* @keyframes movement {
            from{left: 10px;}
            to{left: 200px;}
        } */

        @keyframes movement2 {
            0%{left: 10px;}
            50%{left: 50px}
            100%{left: 200px;}
        }
    </style>
    <title>Animation</title>
</head>
<body>
    <div class="box">Animation</div>
</body>
</html>

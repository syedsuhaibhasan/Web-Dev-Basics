<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            background-color: gray;
        }
        button{
            color: green;
            background-color: beige;
            width: 85px;
            height: 25px;
            border-radius: 10px;
            border: 2px solid green;
        }
        button:hover{
            background-color: green;
            border: 2px solid white;
            width: 90px;
            height: 30px;
            color: white;
        }
        button:active{
            background-color: skyblue;
            border: 2px solid white;
            color: green;
        }
    </style>
    <title>Document</title>
</head>
<body>
    <button><b>Pseudo</b></button>
</body>
</html>
